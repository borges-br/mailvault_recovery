<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="t d" font-family="'Segoe UI', Inter, system-ui, Arial, sans-serif">
  <title id="t">MailVault Recovery</title>
  <desc id="d">Recuperação e exportação de e-mails de arquivos OST e PST para EML e MBOX, 100% local.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15132A"/>
      <stop offset="0.55" stop-color="#1B1838"/>
      <stop offset="1" stop-color="#241C4A"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9283F4"/>
      <stop offset="1" stop-color="#7C6BEF"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#9283F4" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#9283F4" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="340" rx="28" fill="url(#bg)"/>
  <circle cx="180" cy="150" r="260" fill="url(#glow)"/>
  <rect x="1" y="1" width="1198" height="338" rx="27" fill="none" stroke="#3A3168" stroke-width="2"/>

  <!-- Brand mark: vault + envelope -->
  <g transform="translate(96 92)" filter="url(#soft)">
    <rect x="0" y="0" width="156" height="156" rx="30" fill="url(#violet)"/>
    <rect x="0" y="0" width="156" height="156" rx="30" fill="url(#sheen)"/>
    <!-- envelope -->
    <rect x="34" y="44" width="88" height="68" rx="10" fill="#1B1838"/>
    <path d="M40 52 L78 84 L116 52" fill="none" stroke="#C9C0FF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- vault dial -->
    <circle cx="78" cy="92" r="15" fill="none" stroke="#ffffff" stroke-width="5"/>
    <circle cx="78" cy="92" r="3.5" fill="#ffffff"/>
    <path d="M78 80 V73 M78 111 V104 M66 92 H59 M97 92 H90" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(300 118)">
    <text x="0" y="0" fill="#F5F3FF" font-size="62" font-weight="800" letter-spacing="0.5">MailVault<tspan fill="#9283F4"> Recovery</tspan></text>
    <text x="2" y="48" fill="#B9B2E0" font-size="26" font-weight="400">Recupere e exporte e-mails de OST/PST — local, resiliente, simples.</text>

    <!-- Flow chips: OST/PST -> EML/MBOX -->
    <g transform="translate(0 86)" font-size="18" font-weight="700">
      <rect x="0" y="0" width="78" height="40" rx="12" fill="#2A2350" stroke="#4B3F87" stroke-width="1.5"/>
      <text x="39" y="26" fill="#D8D2FF" text-anchor="middle">OST</text>
      <rect x="90" y="0" width="78" height="40" rx="12" fill="#2A2350" stroke="#4B3F87" stroke-width="1.5"/>
      <text x="129" y="26" fill="#D8D2FF" text-anchor="middle">PST</text>

      <path d="M182 20 H232" stroke="#7C6BEF" stroke-width="3" stroke-linecap="round"/>
      <path d="M226 13 L236 20 L226 27" fill="none" stroke="#7C6BEF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

      <rect x="250" y="0" width="86" height="40" rx="12" fill="url(#violet)"/>
      <text x="293" y="26" fill="#15132A" text-anchor="middle">EML</text>
      <rect x="348" y="0" width="100" height="40" rx="12" fill="url(#violet)"/>
      <text x="398" y="26" fill="#15132A" text-anchor="middle">MBOX</text>
    </g>
  </g>

  <!-- Right badge: offline -->
  <g transform="translate(980 60)">
    <rect x="0" y="0" width="150" height="34" rx="17" fill="#13261C" stroke="#2F6B4A" stroke-width="1.5"/>
    <circle cx="24" cy="17" r="6" fill="#4ADE80"/>
    <text x="40" y="23" fill="#A7F3CF" font-size="16" font-weight="700">100% offline</text>
  </g>
</svg>
